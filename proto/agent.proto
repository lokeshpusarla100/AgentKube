syntax = "proto3";

package agentkube.v1;

// Service to control agent execution.
service AgentService {
  // Starts a new agent process.
  rpc StartAgent(StartAgentRequest) returns (StartAgentResponse);
  
  // Stops a running agent process.
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  
  // Streams the status and logs of a running agent.
  rpc StreamAgent(StreamAgentRequest) returns (stream AgentStatusResponse);
}

message StartAgentRequest {
  string agent_id = 1;
  string user_message = 2;
  uint32 max_steps = 3;
}

message StartAgentResponse {
  bool success = 1;
  string message = 2;
}

message StopAgentRequest {
  string agent_id = 1;
}

message StopAgentResponse {
  bool success = 1;
}

message StreamAgentRequest {
  string agent_id = 1;
}

message AgentStatusResponse {
  string agent_id = 1;
  string state = 2;
  string latest_output = 3;
}
